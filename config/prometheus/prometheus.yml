# Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'stock-analytics'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kafka Exporter (if available)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'

  # MinIO metrics
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'

  # HDFS NameNode metrics
  - job_name: 'hdfs-namenode'
    metrics_path: '/jmx'
    static_configs:
      - targets: ['namenode:9870']
        labels:
          service: 'hdfs-namenode'

  # PostgreSQL (for Airflow)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # Airflow metrics (via StatsD exporter if configured)
  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow-statsd-exporter:9102']
        labels:
          service: 'airflow'

  # Trino metrics
  - job_name: 'trino'
    metrics_path: '/v1/metrics'
    static_configs:
      - targets: ['trino-coordinator:8080']
        labels:
          service: 'trino'

  # Node Exporter (for system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
